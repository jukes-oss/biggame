name: Package Game

# Builds installable game packages with a bundled Java runtime, so players
# do not need to install Java themselves, and publishes them as a pre-release.

on:
  push:
    branches: [claude/project-thread-7noyuw]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: Biggame
  APP_VERSION: '1.0.0'
  JAVA_OPTIONS: >-
    -Dhttps.protocols=TLSv1.2,TLSv1.1,TLSv1
    -XX:+ShowCodeDetailsInExceptionMessages
    --enable-native-access=ALL-UNNAMED

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Fetch latest Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build desktop JAR
      run: ./gradlew desktop:dist --stacktrace
    - uses: actions/upload-artifact@v7
      with:
        name: game-jar
        path: desktop/build/libs/Mindustry.jar

  macos:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-latest
          arch: apple-silicon
        - runner: macos-15-intel
          arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        name: game-jar
        path: input
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25
    - name: Build DMG
      run: |
        jpackage --type dmg \
          --name "$APP_NAME" --app-version "$APP_VERSION" \
          --input input --main-jar Mindustry.jar \
          --main-class mindustry.desktop.DesktopLauncher \
          --icon core/assets/icons/icon.icns \
          --mac-package-identifier io.github.jukesoss.biggame \
          --java-options "-XstartOnFirstThread $JAVA_OPTIONS" \
          --dest out
        mv out/*.dmg "out/${APP_NAME}-mac-${{ matrix.arch }}.dmg"
    - uses: actions/upload-artifact@v7
      with:
        name: mac-${{ matrix.arch }}
        path: out/*.dmg

  windows:
    needs: jar
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        name: game-jar
        path: input
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 25
    - name: Build portable folder
      run: |
        jpackage --type app-image \
          --name "$APP_NAME" --app-version "$APP_VERSION" \
          --input input --main-jar Mindustry.jar \
          --main-class mindustry.desktop.DesktopLauncher \
          --icon core/assets/icons/icon.ico \
          --java-options "$JAVA_OPTIONS" \
          --dest out
        cd out && 7z a "${APP_NAME}-windows.zip" "$APP_NAME" > /dev/null
    - name: Build installer
      continue-on-error: true
      run: |
        jpackage --type exe \
          --name "$APP_NAME" --app-version "$APP_VERSION" \
          --input input --main-jar Mindustry.jar \
          --main-class mindustry.desktop.DesktopLauncher \
          --icon core/assets/icons/icon.ico \
          --java-options "$JAVA_OPTIONS" \
          --win-menu --win-shortcut --win-dir-chooser \
          --dest installer
        mv installer/*.exe "out/${APP_NAME}-windows-setup.exe"
    - uses: actions/upload-artifact@v7
      with:
        name: windows
        path: |
          out/*.zip
          out/*.exe

  release:
    needs: [macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: dist
        pattern: '{mac-*,windows}'
        merge-multiple: true
    - name: Publish pre-release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        ls -la dist
        gh release delete preview --yes --cleanup-tag || true
        gh release create preview dist/* \
          --target "$GITHUB_SHA" --prerelease \
          --title "试玩版 (开局引导)" \
          --notes "从 ${GITHUB_REF_NAME} 分支自动打包，自带 Java，不用另外安装。"
