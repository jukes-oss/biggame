name: Build Game

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Fetch latest Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build desktop and server JARs
      run: ./gradlew desktop:dist server:dist --stacktrace
    - name: Upload desktop JAR
      uses: actions/upload-artifact@v7
      with:
        name: Mindustry-desktop
        path: desktop/build/libs/Mindustry.jar
    - name: Upload server JAR
      uses: actions/upload-artifact@v7
      with:
        name: Mindustry-server
        path: server/build/libs/server-release.jar

  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Fetch latest Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build debug APK
      run: ./gradlew android:assembleDebug --stacktrace
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: Mindustry-android
        path: android/build/outputs/apk/**/*.apk
